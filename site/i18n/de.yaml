- id: hero_title
  translation: "Videos im Usenet ablegen. Verschlüsselt. Abspielbar ab der ersten Sekunde."
- id: hero_body
  translation: "US3 ist ein offenes Format. Eine Datei wird zu einem AES-256-ZIP und liegt verteilt auf vielen Artikeln im Usenet. Ein einziges Token sagt, wo sie liegen und wie sie aufgehen."
- id: hero_cta_turbine
  translation: "turbine laden"
- id: hero_cta_spec
  translation: "Spezifikation lesen"
- id: tile_turbine_body
  translation: "Installieren, Usenet-Zugang eintragen, fertig. Danach genügt ein Klick auf einen Link, und das Video läuft, im Browser oder in deinem Mediaserver."
- id: tile_turbine_news
  translation: "Was ist neu"
- id: tile_turbine_help
  translation: "Hilfe zur Einrichtung"
- id: tile_pmpwrk_body
  translation: "Zum vollautomatischen Hochladen eigener Videos. pmpwrk verschlüsselt, postet und legt Reserven an. Danach prüft es in Abständen jeden Upload und postet nach, was verloren ging, solange du es laufen lässt."
- id: tile_pmpwrk_link
  translation: "So arbeitet pmpwrk →"
- id: tile_spec_title
  translation: "Spezifikation"
- id: tile_spec_body
  translation: "Token, Schlüsselableitung, Message-IDs, ZIP-Aufbau, PAR2. Vollständig und offen beschrieben, auf Deutsch und Englisch, damit jeder eigene Werkzeuge bauen kann."
- id: how_title
  translation: "So funktioniert US3"
- id: how_1_title
  translation: "Ein Token"
- id: how_1_body
  translation: "pmpwrk erzeugt ein zufälliges Token. Daraus leiten sich Schlüssel und Fundorte ab, sonst gibt es nichts zu merken."
- id: how_2_title
  translation: "Verschlüsselt, im Fluss"
- id: how_2_body
  translation: "Die Datei wird zu einem AES-256-ZIP, in Artikel geteilt und gepostet. Auf die Platte kommt dabei nichts."
- id: how_3_title
  translation: "Mit Reserve"
- id: how_3_body
  translation: "PAR2-Daten liegen daneben. Geht ein Teil verloren, wird er daraus neu berechnet und nachgepostet."
- id: how_4_title
  translation: "Sofort abspielen"
- id: how_4_body
  translation: "turbine rechnet aus jeder Stelle im Video den passenden Artikel aus und lädt nur den. Vorspulen kostet Sekunden."
- id: logo_alt
  translation: "US3 – Usenet Simplified Streaming Specification"
- id: last_title
  translation: "Gebaut, um zu bleiben"
- id: last_1
  translation: "Usenet-Anbieter halten Artikel über viele Jahre. US3 nutzt das, ohne sich darauf zu verlassen: Jeder Upload trägt Reservedaten mit, und pmpwrk ersetzt fehlende Teile, bevor sie zum Problem werden."
- id: last_2
  translation: "Und falls die US3-Werkzeuge mal nicht zur Hand sind: Alle Artikel der Reihe nach ergeben ein gewöhnliches verschlüsseltes ZIP. 7-Zip und das Passwort genügen."
- id: last_3
  translation: "Das Format ist offen beschrieben. Nichts hängt an einem einzelnen Programm oder Anbieter, und jeder kann eigene Werkzeuge dafür bauen."
- id: tech_aes
  translation: "verschlüsselt, als gewöhnliches ZIP nach WinZip AE-2"
- id: tech_fuse
  translation: "bindet die Bibliothek als Ordner ein, als läge alles auf der Platte"
- id: tech_dav
  translation: "gibt die Bibliothek für Mediaserver frei"
- id: bring_title
  translation: "Was du mitbringst"
- id: bring_body
  translation: "Einen Zugang bei einem Usenet-Anbieter, einen Mac oder Windows-PC und etwas Lust an Technik. turbine ist einfach, aber du trägst selbst einen Newsserver ein und lässt eine nicht signierte App starten."
- id: not_title
  translation: "Was US3 nicht ist"
- id: not_body
  translation: "Kein Katalog und keine Suche. US3 legt ab und spielt ab, was du selbst hochlädst oder bekommst. Wer welche Inhalte posten darf, regeln Urheberrecht und die Bedingungen deines Anbieters."
