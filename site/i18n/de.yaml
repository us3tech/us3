- id: dl_synology
  translation: "Ab DSM 7.0. Welchen Prozessor deine Synology hat, steht unter Systemsteuerung › Infocenter. Danach erscheint deine Bibliothek als freigegebener Ordner, den dein Mediaserver direkt lesen kann."
- id: dl_help_lead
  translation: "Hilfe beim Installieren?"
- id: dl_help_link
  translation: "So geht’s weiter"
- id: spec_hero_title
  translation: "Ein Token. Daraus folgt alles andere."
- id: spec_hero_body
  translation: "US3 beschreibt, wie eine einzelne Datei als verschlüsselter ZIP-Strom im Usenet liegt, sodass sie sich direkt abspielen lässt und trotzdem ein gewöhnliches ZIP bleibt. Wo jedes Stück liegt und wie es aufgeht, wird aus einem einzigen Geheimnis berechnet."
- id: spec_stand
  translation: "Stand"
- id: spec_as_markdown
  translation: "Als Markdown"
- id: spec_other_language
  translation: "English version"
- id: spec_history
  translation: "Änderungen im Repository"
- id: spec_path_aria
  translation: "Der Weg einer Datei"
- id: spec_path_1_title
  translation: "Token"
- id: spec_path_1_body
  translation: "32 Byte Zufall, dazu Größe, Blockgröße, Endung"
- id: spec_path_2_title
  translation: "Ableitung"
- id: spec_path_2_body
  translation: "ZIP-Passwort und Message-IDs per HMAC-SHA-256"
- id: spec_path_3_title
  translation: "ZIP-Strom"
- id: spec_path_3_body
  translation: "AES-256, in gleich große Artikel geteilt, yEnc"
- id: spec_path_4_title
  translation: "Reserve"
- id: spec_path_4_body
  translation: "PAR2 und Generationen für Reparaturen"
- id: spec_path_5_title
  translation: "Abspielen"
- id: spec_path_5_body
  translation: "Byte-Position → Artikel → Message-ID"
- id: spec_prop_1_title
  translation: "Zustandslos"
- id: spec_prop_1_body
  translation: "Kein Index, keine NZB, kein Server, der etwas weiß. Wer das Token hat, berechnet jede Message-ID selbst."
- id: spec_prop_2_title
  translation: "Nicht verkettbar"
- id: spec_prop_2_body
  translation: "Jeder Artikel trägt eine eigene, abgeleitete ID. Von außen haben die Teile eines Uploads nichts gemeinsam."
- id: spec_prop_3_title
  translation: "Rückwärtskompatibel"
- id: spec_prop_3_body
  translation: "Alle Artikel der Reihe nach sind eine gültige ZIP-Datei nach WinZip AE-2. 7-Zip öffnet sie mit dem abgeleiteten Passwort."
- id: spec_toc
  translation: "Inhalt"
- id: spec_toc_aria
  translation: "Inhalt der Spezifikation"
- id: spec_license
  translation: "Lizenziert unter CC BY 4.0."
- id: pm_tagline
  translation: "Ordner füllen, den Rest erledigt pmpwrk. Auch Monate später noch."
- id: pm_lead
  translation: "pmpwrk lädt eigene Videos vollautomatisch ins Usenet und kümmert sich danach um sie: Es prüft in Abständen, ob noch alles da ist, und stellt fehlende Teile wieder her, bevor jemand etwas davon merkt."
- id: pm_care_title
  translation: "Nachsorge"
- id: pm_care_count
  translation: "3 Uploads"
- id: pm_care_ok
  translation: "alles da"
- id: pm_care_repair
  translation: "repariert gerade"
- id: pm_way_title
  translation: "Der Weg eines Videos"
- id: pm_way_1_title
  translation: "Datei in den Eingangsordner legen"
- id: pm_way_1_body
  translation: "Sobald sie fertig kopiert ist, nimmt pmpwrk sie sich vor. Wer lieber selbst bestimmt, schaltet auf Handbetrieb und gibt jede Datei im Browser frei."
- id: pm_way_2_title
  translation: "In einem Zug verschlüsselt und gepostet"
- id: pm_way_2_body
  translation: "Die Datei wird einmal gelesen, verschlüsselt und in Artikel geteilt, die Reservedaten entstehen nebenher. Bricht etwas ab, macht pmpwrk nach dem Neustart genau dort weiter."
- id: pm_way_3_title
  translation: "Link kopieren, fertig"
- id: pm_way_3_body
  translation: "Zu jedem fertigen Upload gibt es einen Link, den turbine öffnet. Für klassische Programme liegt auch eine NZB bereit."
- id: pm_way_4_title
  translation: "Nachsorge mit Ampel"
- id: pm_way_4_body
  translation: "pmpwrk schaut regelmäßig nach. Grün heißt alles da, Gelb heißt pmpwrk repariert gerade, Rot heißt, hier musst du selbst entscheiden. Bei Rot meldet sich pmpwrk einmal, auf der Seite und als Mitteilung auf deinem Rechner."
- id: pm_more_title
  translation: "Was sonst noch drin ist"
- id: pm_more_1_title
  translation: "Zweite Meinung"
- id: pm_more_1_body
  translation: "Auf Wunsch prüft pmpwrk auch bei einem zweiten Anbieter, ob deine Uploads dort angekommen sind. Nur lesend."
- id: pm_more_2_title
  translation: "Läuft nebenbei"
- id: pm_more_2_body
  translation: "Ein Symbol in der Menüleiste oder im Infobereich, Start bei der Anmeldung, bedient wird im Browser."
- id: pm_more_3_title
  translation: "Eigene Skripte"
- id: pm_more_3_body
  translation: "Nach jedem Upload oder bei Rot kann pmpwrk ein Skript starten, das etwa eine Mail schickt oder die Quelle wegräumt."
- id: pm_more_4_title
  translation: "Auch ohne Bildschirm"
- id: pm_more_4_body
  translation: "Als Dienst auf einem Server oder NAS, mit REST-Schnittstelle und Messwerten für Prometheus."
- id: pm_note
  translation: "Wichtig: Was im Usenet steht, lässt sich nicht zurückholen. pmpwrk startet deshalb im Handbetrieb und lädt erst hoch, wenn du eine Datei freigibst. Die Quelldatei bleibt liegen, denn aus ihr repariert pmpwrk später."
- id: help_crumb
  translation: "Hilfe beim Installieren"
- id: help_lead
  translation: "In fünf Minuten erledigt. Du brauchst nur die Zugangsdaten deines Usenet-Anbieters: Servername, Benutzername und Passwort."
- id: help_tabs_aria
  translation: "Plattform"
- id: help_windows_1_title
  translation: "MSI-Paket doppelklicken"
- id: help_windows_1_body
  translation: "Nimm <code>x64</code> für die meisten PCs, <code>ARM</code> für Geräte mit Snapdragon-Prozessor."
- id: help_windows_2_title
  translation: "Blaues Fenster „Der Computer wurde durch Windows geschützt“"
- id: help_windows_2_body
  translation: "turbine ist noch nicht bei Microsoft registriert. Klicke auf „Weitere Informationen“ und dann auf „Trotzdem ausführen“. Das passiert nur beim ersten Mal."
- id: help_win_dialog_title
  translation: "Der Computer wurde durch Windows geschützt"
- id: help_win_dialog_more
  translation: "Weitere Informationen"
- id: help_win_dialog_run
  translation: "Trotzdem ausführen"
- id: help_windows_3_title
  translation: "Newsserver eintragen"
- id: help_windows_3_body
  translation: "turbine öffnet sich im Browser. Trage Server, Benutzername und Passwort ein und klicke auf „Verbindung testen“. Unten rechts im Infobereich sitzt jetzt das turbine-Rad."
- id: help_windows_4_title
  translation: "Link anklicken"
- id: help_windows_4_body
  translation: "Fertig. Ab jetzt öffnet jeder US3-Link das Video direkt in turbine."
- id: help_macos_1_title
  translation: "Disk-Image öffnen, turbine in „Programme“ ziehen"
- id: help_macos_1_body
  translation: "Oder im Terminal: <code>brew install --cask {{ .Tap }}/turbine</code>"
- id: help_macos_2_title
  translation: "Beim ersten Start einmal erlauben"
- id: help_macos_2_body
  translation: "macOS meldet, dass turbine nicht geöffnet werden kann. Öffne Systemeinstellungen › Datenschutz &amp; Sicherheit, scrolle nach unten und klicke bei turbine auf „Dennoch öffnen“."
- id: help_macos_3_title
  translation: "Newsserver eintragen"
- id: help_macos_3_body
  translation: "turbine öffnet sich im Browser. Server, Benutzername, Passwort, „Verbindung testen“. Das Rad sitzt jetzt oben in der Menüleiste."
- id: help_macos_4_title
  translation: "Link anklicken"
- id: help_macos_4_body
  translation: "Fertig. Ab jetzt öffnet jeder US3-Link das Video direkt in turbine."
- id: help_synology_1_title
  translation: "Das passende Paket wählen"
- id: help_synology_1_body
  translation: "Systemsteuerung › Infocenter zeigt den Prozessor. Intel oder AMD: <code>x86_64</code>. Realtek: <code>armv8</code>. Ältere Modelle mit 32-Bit-ARM werden nicht unterstützt."
- id: help_synology_2_title
  translation: "Paket-Zentrum › Manuelle Installation"
- id: help_synology_2_body
  translation: "Die SPK-Datei auswählen. DSM weist darauf hin, dass das Paket nicht von Synology stammt. Bestätigen, weiter."
- id: help_synology_3_title
  translation: "turbine aus dem Hauptmenü öffnen"
- id: help_synology_3_body
  translation: "Newsserver eintragen wie am Rechner. Deine Bibliothek liegt danach in {{ .Folder }}."
- id: help_syn_folder
  translation: "dem freigegebenen Ordner, den turbine anlegt"
- id: help_synology_4_title
  translation: "Ordner im Mediaserver hinzufügen"
- id: help_synology_4_body
  translation: "Als Mediathek anlegen, fertig. Neue Links landen dort von selbst."
- id: help_syn_soon
  translation: "Das Synology-Paket erscheint demnächst."
- id: help_sum_title
  translation: "Download prüfen"
- id: help_sum_lead
  translation: "Die Ausgabe des Befehls muss mit der Prüfsumme (SHA-256) dahinter übereinstimmen."
- id: help_aside_1_title
  translation: "Noch keinen Usenet-Zugang?"
- id: help_aside_1_body
  translation: "turbine funktioniert mit jedem Anbieter, der verschlüsselte Verbindungen anbietet. Die gibt es im Monatsabo oder als Datenpaket."
- id: help_aside_2_title
  translation: "Hakt es?"
- id: help_aside_2_body
  translation: "Unter {{ .Link }} › Issues fragen. Hilfreich sind die Version, das System und was genau passiert ist."
- id: ch_intro
  translation: "Alle Versionen von turbine und pmpwrk und die Änderungen an der Spezifikation. Die neueste steht oben."
