- id: ch_spec_label
  translation: "Spec"
- id: ch_feed
  translation: "RSS-Feed"
- id: ch_feed_title
  translation: "US3 – Was ist neu"
- id: tb_tagline
  translation: "Link anklicken, Film läuft. Ohne vorher alles herunterzuladen."
- id: tb_lead
  translation: "turbine holt aus dem Usenet nur die Stücke, die gerade gebraucht werden, und gibt das Video an deinen Browser oder Mediaserver weiter. Vorspulen geht sofort, auch mitten in einem langen Film."
- id: tb_lib_title
  translation: "Bibliothek"
- id: tb_lib_count
  translation: "3 Filme"
- id: tb_lib_playing
  translation: "läuft"
- id: tb_lib_ready
  translation: "bereit"
- id: tb_way_title
  translation: "Vom Link zum Bild"
- id: tb_way_1_title
  translation: "Einmal einrichten"
- id: tb_way_1_body
  translation: "Server, Benutzername und Passwort deines Usenet-Anbieters eintragen und auf „Verbindung testen“ klicken. Mehr gibt es nicht einzustellen."
- id: tb_way_2_title
  translation: "Link anklicken"
- id: tb_way_2_body
  translation: "Ein US3-Link aus Mail, Chat oder Webseite landet mit einem Klick in deiner Bibliothek. Du kannst ihn auch auf der Seite von turbine einfügen."
- id: tb_way_3_title
  translation: "Sofort abspielen"
- id: tb_way_3_body
  translation: "turbine rechnet aus, in welchem Artikel jede Stelle des Videos liegt, und lädt nur diesen. Der Film startet nach Sekunden, und ein Sprung ans Ende dauert nicht länger."
- id: tb_way_4_title
  translation: "Im Mediaserver ansehen"
- id: tb_way_4_body
  translation: "Die Bibliothek steht als freigegebener Ordner im Heimnetz. Dein Mediaserver nimmt sie auf wie jede andere Videosammlung, und der Film läuft auf dem Fernseher."
- id: tb_more_title
  translation: "Was sonst noch drin ist"
- id: tb_more_1_title
  translation: "Viele Verbindungen"
- id: tb_more_1_body
  translation: "turbine liest über mehrere Verbindungen gleichzeitig voraus. So läuft auch ein großer Film flüssig, soweit dein Zugang es hergibt."
- id: tb_more_2_title
  translation: "Spielt weiter"
- id: tb_more_2_body
  translation: "Ist ein Stück endgültig verloren, gibt es an der Stelle einen kurzen Ruckler. Der Film bricht deshalb nicht ab."
- id: tb_more_3_title
  translation: "Läuft nebenbei"
- id: tb_more_3_body
  translation: "Ein Symbol in der Menüleiste oder im Infobereich, Start bei der Anmeldung, bedient wird im Browser."
- id: tb_more_4_title
  translation: "Mit Passwort"
- id: tb_more_4_body
  translation: "Gibst du die Bibliothek im Heimnetz frei, schützt ein Passwort die Seite und den Ordner."
- id: tb_note
  translation: "turbine braucht nur deinen eigenen Zugang bei einem Usenet-Anbieter. Es gibt keinen Katalog und keine Suche: Abgespielt wird, wofür du einen Link hast."
- id: tile_turbine_more
  translation: "So arbeitet turbine"
