- id: hero_title
  translation: "Store videos on Usenet. Encrypted. Playable from the first second."
- id: hero_body
  translation: "US3 is an open format. A file becomes an AES-256 ZIP and is spread across many articles on Usenet. A single token says where they are and how they fit together."
- id: hero_cta_turbine
  translation: "Get turbine"
- id: hero_cta_spec
  translation: "Read the specification"
- id: tile_turbine_body
  translation: "Install, enter your Usenet account, done. After that a click on a link is enough and the video plays, in the browser or in your media server."
- id: tile_turbine_news
  translation: "What’s new"
- id: tile_turbine_help
  translation: "Setup help"
- id: tile_pmpwrk_body
  translation: "For fully automatic uploading of your own videos. pmpwrk encrypts, posts and creates reserves. Afterwards it checks every upload at intervals and reposts what was lost, as long as you leave it running."
- id: tile_pmpwrk_link
  translation: "How pmpwrk works →"
- id: tile_spec_title
  translation: "Specification"
- id: tile_spec_body
  translation: "Token, key derivation, message IDs, ZIP layout, PAR2. Described completely and openly, in German and English, so anyone can build their own tools."
- id: how_title
  translation: "How US3 works"
- id: how_1_title
  translation: "One token"
- id: how_1_body
  translation: "pmpwrk generates a random token. Keys and locations are derived from it, so there is nothing else to remember."
- id: how_2_title
  translation: "Encrypted, on the fly"
- id: how_2_body
  translation: "The file becomes an AES-256 ZIP, is split into articles and posted. Nothing is written to disk along the way."
- id: how_3_title
  translation: "With a reserve"
- id: how_3_body
  translation: "PAR2 data sits alongside. If a part is lost, it is recomputed from it and reposted."
- id: how_4_title
  translation: "Play instantly"
- id: how_4_body
  translation: "turbine works out the matching article for any point in the video and loads only that one. Seeking takes seconds."
- id: logo_alt
  translation: "US3 – Usenet Simplified Streaming Specification"
- id: last_title
  translation: "Built to last"
- id: last_1
  translation: "Usenet providers keep articles for many years. US3 makes use of that without relying on it: every upload carries reserve data, and pmpwrk replaces missing parts before they become a problem."
- id: last_2
  translation: "And if the US3 tools are not at hand: all articles in order make an ordinary encrypted ZIP. 7-Zip and the password are enough."
- id: last_3
  translation: "The format is openly described. Nothing depends on a single program or provider, and anyone can build their own tools for it."
- id: tech_aes
  translation: "encrypts, as an ordinary ZIP following WinZip AE-2"
- id: tech_fuse
  translation: "mounts the library as a folder, as if it were all on disk"
- id: tech_dav
  translation: "shares the library with media servers"
- id: bring_title
  translation: "What you bring"
- id: bring_body
  translation: "An account with a Usenet provider, a Mac or Windows PC and some enjoyment of technology. turbine is simple, but you enter a news server yourself and let an unsigned app start."
- id: not_title
  translation: "What US3 is not"
- id: not_body
  translation: "No catalogue and no search. US3 stores and plays what you upload yourself or receive. Who may post which content is governed by copyright law and your provider’s terms."
