- id: ch_feed_title
  translation: "US3 – What's new"
- id: tb_tagline
  translation: "Click a link, the film plays. Without downloading it all first."
- id: tb_lead
  translation: "turbine fetches from Usenet only the pieces that are needed right now and hands the video to your browser or media server. Seeking is instant, even in the middle of a long film."
- id: tb_lib_title
  translation: "Library"
- id: tb_lib_count
  translation: "3 films"
- id: tb_lib_playing
  translation: "playing"
- id: tb_lib_ready
  translation: "ready"
- id: tb_way_title
  translation: "From link to picture"
- id: tb_way_1_title
  translation: "Set up once"
- id: tb_way_1_body
  translation: "Enter the server, user name and password of your Usenet provider and click “Test connection”. There is nothing else to set."
- id: tb_way_2_title
  translation: "Click a link"
- id: tb_way_2_body
  translation: "A US3 link from a mail, a chat or a web page lands in your library with one click. You can also paste it on turbine’s page."
- id: tb_way_3_title
  translation: "Play at once"
- id: tb_way_3_body
  translation: "turbine works out which article holds each point in the video and fetches only that one. The film starts within seconds, and a jump to the end takes no longer."
- id: tb_way_4_title
  translation: "Watch in your media server"
- id: tb_way_4_body
  translation: "The library is a shared folder on your home network. Your media server takes it in like any other video collection, and the film plays on the TV."
- id: tb_more_title
  translation: "What else is in it"
- id: tb_more_1_title
  translation: "Many connections"
- id: tb_more_1_body
  translation: "turbine reads ahead over several connections at once. So even a large film plays smoothly, as far as your account allows."
- id: tb_more_2_title
  translation: "Plays on"
- id: tb_more_2_body
  translation: "If a piece is lost for good, there is a short glitch at that point. The film does not stop because of it."
- id: tb_more_3_title
  translation: "Runs alongside"
- id: tb_more_3_body
  translation: "An icon in the menu bar or notification area, starts at login, operated in the browser."
- id: tb_more_4_title
  translation: "With a password"
- id: tb_more_4_body
  translation: "If you share the library on your home network, a password protects the page and the folder."
- id: tb_note
  translation: "turbine only needs your own account with a Usenet provider. There is no catalogue and no search: it plays what you have a link for."
- id: tile_turbine_more
  translation: "How turbine works"
